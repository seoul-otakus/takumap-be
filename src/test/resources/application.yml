spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop # 테스트 시작 시 테이블 만들고, 끝나면 삭제
    properties:
      hibernate:
        # show_sql: true # SQL 로그 보고 싶으면 주석 해제
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "test-client-id"
            client-secret: "test-client-secret"
            scope: "email, profile"

cloud:
  aws:
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket-name: dummy
    credentials:
      access-key: test
      secret-key: test
